name: FarmSight Weekly Engine

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. CHECKOUT CODE
      # -----------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------
      # 2. SETUP PYTHON
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # -----------------------------
      # 3. INSTALL DEPENDENCIES
      # -----------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # 4. AUTHENTICATE GOOGLE EARTH ENGINE 🔥
      # -----------------------------
      - name: Authenticate GEE
        run: |
          echo '${{ secrets.GEE_JSON_KEY }}' > gee-key.json

      # -----------------------------
      # 5. RUN ENGINE
      # -----------------------------
      - name: Run NDVI Engine
        env:
          DB_URL: ${{ secrets.DB_URL }}
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: gee-key.json
        run: python backend/ndvi_engine.py