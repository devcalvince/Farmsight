name: FarmSight Weekly Engine

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. CHECKOUT CODE
      # -----------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------
      # 2. SETUP PYTHON
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'   # 🔥 upgrade (future-safe)

      # -----------------------------
      # 3. INSTALL DEPENDENCIES
      # -----------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # 4. RUN ENGINE
      # -----------------------------
      - name: Run NDVI Engine
        env:
          DB_URL: ${{ secrets.DB_URL }}
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
          GEE_JSON_KEY: ${{ secrets.GEE_JSON_KEY }}   # 🔥 THIS is what your code needs
          MODE: SIMULATION
        run: python backend/ndvi_engine.py
