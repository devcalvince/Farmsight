name: FarmSight Weekly Engine

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NDVI Engine
        env:
          DB_URL: ${{ secrets.DB_URL }}
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
          GEE_JSON_KEY: ${{ secrets.GEE_JSON_KEY }}
          MODE: SIMULATION
        run: python backend/ndvi_engine.py